<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VaaniFlow">
  <!-- VaaniFlow mark: five voice bars stepping down into a "V". The lowest, teal bar is the AI. -->
  <defs>
    <linearGradient id="vf-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B6BFF"/>
      <stop offset="1" stop-color="#4527E8"/>
    </linearGradient>
    <linearGradient id="vf-hi" x1="32" y1="0" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#vf-bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#vf-hi)"/>
  <g fill="#fff">
    <rect x="10" y="14" width="6" height="22" rx="3"/>
    <rect x="19.5" y="21" width="6" height="22" rx="3"/>
    <rect x="38.5" y="21" width="6" height="22" rx="3"/>
    <rect x="48" y="14" width="6" height="22" rx="3"/>
  </g>
  <rect x="29" y="28" width="6" height="22" rx="3" fill="#5EEAD4"/>
</svg>
