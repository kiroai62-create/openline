<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VaaniFlow">
  <defs>
    <linearGradient id="vf-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B47FB"/>
      <stop offset=".55" stop-color="#3E7BF6"/>
      <stop offset="1" stop-color="#14C8B0"/>
    </linearGradient>
    <linearGradient id="vf-shine" x1="32" y1="0" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
